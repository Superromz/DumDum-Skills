name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('dumdum-skills/.claude-plugin/plugin.json', 'utf8')); console.log('plugin.json is valid JSON');"

      - name: Check every registered skill has a SKILL.md
        run: |
          PLUGIN_JSON="dumdum-skills/.claude-plugin/plugin.json"
          MISSING=0
          SKILLS=$(node -e "
            const p = JSON.parse(require('fs').readFileSync('$PLUGIN_JSON', 'utf8'));
            const skills = p.skills || p.commands || [];
            skills.forEach(s => {
              const path = s.path || s.file || '';
              if (path) console.log(path);
            });
          ")
          for SKILL_PATH in $SKILLS; do
            FULL_PATH="dumdum-skills/$SKILL_PATH"
            if [ ! -f "$FULL_PATH" ]; then
              echo "ERROR: Missing skill file: $FULL_PATH"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "Some registered skills are missing their SKILL.md files."
            exit 1
          fi
          echo "All registered skills have corresponding SKILL.md files."

      - name: Check for em-dashes
        run: |
          if grep -rn $'\xe2\x80\x94' --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' .; then
            echo "ERROR: Em-dashes found in the files listed above. Use commas, periods, or rewrite the sentence."
            exit 1
          fi
          echo "No em-dashes found."
